[project]
name = "chile-sii-sdk"
version = "0.1.0"
description = "Open-source Python SDK for Chilean SII services and compliance workflows"
authors = [
    {name = "Eli-ezer Reuven Ramirez Ruiz",email = "ramirez.ruiz.eliezer.reuven@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/ezer-mackenzie/chile-sii-sdk"
Repository = "https://github.com/ezer-mackenzie/chile-sii-sdk"
Documentation = "https://example.com/chile-sii-sdk"

[dependency-groups]
dev = [
    "basedpyright (>=1.40.0,<2.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "benchcore (>=1.0.0,<2.0.0)",
    "pytest (>=8.3.0,<9.0.0)",
    "pytest-cov (>=5.0.0,<7.0.0)"
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
exclude = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
